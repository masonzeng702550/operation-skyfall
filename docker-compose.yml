# Range stack. One per team:  docker compose -p team01 up -d
#
# Published to the player:
#   ${TAP_PORT}/tcp   the man-in-the-middle tap — the only way onto the link
#   ${VIZ_PORT}/tcp   read-only dual-view dashboard
#
# The simulator's MAVLink port is deliberately NOT published. Talking to the
# aircraft directly would skip the point of the exercise, so the only route to
# it runs through the relay — which is to say, through the player.
#
# The watcher is not published either. It holds the only copy of the flag.

services:
  sitl:
    build:
      context: ./sitl
      args:
        ARDUPILOT_BRANCH: ${ARDUPILOT_BRANCH:-Copter-4.6.3}
    image: thjcc/ardupilot-sitl:${ARDUPILOT_TAG:-4.6.3}
    restart: unless-stopped
    environment:
      WATCHER_HOST: watcher
      VIZ_HOST: viz
      HOME_LOC: "-35.363262,149.165237,584,0"
      SPEEDUP: "1"
    networks: [dronenet]
    depends_on: [watcher, viz]

  mitm:
    build: ./mitm
    image: thjcc/dronectf-mitm:1
    restart: unless-stopped
    environment:
      GCS_PORT: "14570"
      UAV_HOST: sitl
      UAV_PORT: "14550"
      TAP_PORT: "14580"
    ports:
      - "${TAP_PORT:-14580}:14580"
    networks: [dronenet]
    depends_on: [sitl]

  gcs:
    build: ./gcs
    image: thjcc/dronectf-gcs:1
    restart: unless-stopped
    environment:
      UPLINK: "udpout:mitm:14570"
      REUPLOAD_PERIOD_S: "60"
      CRUISE_ALT: "30"
      BELIEF_SINKS: "http://watcher:9000/api/belief,http://viz:8080/api/belief"
    networks: [dronenet]
    depends_on: [mitm]

  watcher:
    build: ./watcher
    image: thjcc/dronectf-watcher:3
    restart: unless-stopped
    environment:
      # The flag exists ONLY here. A shell in sitl, mitm, gcs or viz gains nothing.
      #
      # static:  serves FLAG verbatim to everyone.
      # dynamic: derives a per-team flag from FLAG_SECRET + TEAM_ID, so a
      #          leaked flag names the team that leaked it.
      FLAG_MODE: "${FLAG_MODE:-static}"
      FLAG: "${FLAG:-}"
      FLAG_SECRET: "${FLAG_SECRET:-}"
      TEAM_ID: "${TEAM_ID:-solo}"
      HOME_LAT: "-35.363262"
      HOME_LON: "149.165237"
      CAPTURE_LAT: "-35.363262"
      CAPTURE_LON: "149.166537"
      CAPTURE_RADIUS_M: "25"
      MIN_AGL_M: "5"
      HOLD_S: "10"
      VIZ_URL: "http://viz:8080/api/solved"
      SOLVE_TOKEN: "${SOLVE_TOKEN:-change-me-per-deployment}"
    networks: [dronenet]
    # Deliberately NOT published.

  viz:
    build: ./viz
    image: thjcc/dronectf-viz:3
    restart: unless-stopped
    environment:
      HOME_LAT: "-35.363262"
      HOME_LON: "149.165237"
      TARGET_LAT: "-35.363262"
      TARGET_LON: "149.166537"
      TARGET_RADIUS_M: "25"
      DIVERGENCE_M: "50"
      SOLVE_TOKEN: "${SOLVE_TOKEN:-change-me-per-deployment}"
    ports:
      - "${VIZ_PORT:-8080}:8080"
    networks: [dronenet]

networks:
  dronenet:
    driver: bridge
