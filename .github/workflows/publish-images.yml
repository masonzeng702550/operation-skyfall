name: publish images

# Build the five range images for amd64 and arm64 and push them to GHCR, so a
# deploy host can pull and run without compiling ArduPilot (10-20 min from
# source). Uses the built-in GITHUB_TOKEN — no personal token or extra scope
# needed to push to this repo's own container registry.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "sitl/**"
      - "mitm/**"
      - "gcs/**"
      - "watcher/**"
      - "viz/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # sitl compiles ArduPilot. amd64 is native (~15 min) and covers the
          # realistic deploy target. arm64 here would run under QEMU for ~2.6 h
          # and flakes; arm64 hosts should build from source instead, which is
          # faster than pulling a QEMU-built image anyway.
          - service: sitl
            context: ./sitl
            platforms: linux/amd64
            build_args: ARDUPILOT_BRANCH=Copter-4.6.3
          - service: mitm
            context: ./mitm
            platforms: linux/amd64,linux/arm64
          - service: gcs
            context: ./gcs
            platforms: linux/amd64,linux/arm64
          - service: watcher
            context: ./watcher
            platforms: linux/amd64,linux/arm64
          - service: viz
            context: ./viz
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4

      # arm64 layers build under emulation on this amd64 runner. Fast for the
      # Python images; the ArduPilot compile (sitl) is the slow one.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/skyfall-${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/skyfall-${{ matrix.service }}:${{ github.sha }}
          # No gha cache: mode=max over the multi-GB ArduPilot build blows past
          # the 10 GB Actions cache limit, gets evicted mid-run, and the export
          # then fails with "not_found". The app images rebuild in minutes
          # anyway; sitl is slow either way.
